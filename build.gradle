plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "rail-junctions"
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.withType(Jar).configureEach {
    from(rootProject.file("LICENSE")) {
        into("META-INF")
        rename { "LICENSE_railmod" }
    }
    from(rootProject.file("COPYING")) {
        into("META-INF")
        rename { "COPYING_railmod" }
    }
    from(rootProject.file("NOTICE")) {
        into("META-INF")
        rename { "NOTICE_railmod" }
    }
    from(rootProject.file("THIRD_PARTY.md")) {
        into("META-INF")
        rename { "THIRD_PARTY_railmod.md" }
    }
    from(rootProject.file("THIRD_PARTY_LICENSES")) {
        into("META-INF/THIRD_PARTY_LICENSES")
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
